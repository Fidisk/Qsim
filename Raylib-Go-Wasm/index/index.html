<html>

<head>
  <meta charset="utf-8" />
  <script src="wasm_exec.js"></script>
</head>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* No scrollbars: the canvas is fitted to the window */
    background: #000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
  }
</style>

<body>
  <canvas id="canvas" width="1600" height="900"></canvas>
  <script>
    // The app runs at a fixed internal resolution (BASE_W x BASE_H, matching
    // InitMainWindow in main.go). Only the DISPLAY size of the canvas is
    // scaled to fit the browser window, preserving aspect ratio; emscripten
    // maps mouse coordinates through the canvas rect, so input stays correct.
    const canvas = document.getElementById("canvas");
    const BASE_W = 1600, BASE_H = 900;

    function fitCanvas() {
      const scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
      const w = Math.round(BASE_W * scale) + "px";
      const h = Math.round(BASE_H * scale) + "px";
      if (canvas.style.width !== w) canvas.style.width = w;
      if (canvas.style.height !== h) canvas.style.height = h;
    }

    // Re-apply whenever the window resizes, and whenever raylib touches the
    // canvas attributes/style (e.g. at InitWindow). The equality checks in
    // fitCanvas keep this from looping.
    new MutationObserver(fitCanvas).observe(canvas, {
      attributes: true,
      attributeFilter: ["width", "height", "style"],
    });
    window.addEventListener("resize", fitCanvas);
    window.addEventListener("load", fitCanvas);
    fitCanvas();
  </script>
  <script type="module" src="./index.js"></script>
</body>

</html>
